plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
}

application {
    mainClass = 'com.aor.player.Game'
}

group = 'com.aor.player.hero'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.googlecode.lanterna:lanterna:3.1.1'

    // Pitest JUnit 5 plugin
    testImplementation 'org.pitest:pitest-junit5-plugin:1.2.0'

}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

pitest {
    targetClasses = ['com.aor.player.*']
    targetTests = ['com.aor.player.*']
    pitestVersion = '1.15.3'
    junit5PluginVersion = '1.2.0'
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutators = ['DEFAULTS']
    timeoutFactor = 2.0
}